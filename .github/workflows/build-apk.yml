name: Build Debug APK

on:
  push:
    branches: [ artemis-foldable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleNonRoot_gameDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: artemis-foldable-debug
          path: app/build/outputs/apk/nonRoot_game/debug/*.apk
          retention-days: 7
